    <h1>Student Registration Form</h1>

    <form action="thanks.html" method="get">

        <label>Full Name:</label>
        <input type="text" name="fullname"
               placeholder="Enter your full name" required>
        <br><br>

        <label>Registration No:</label>
        <input type="text" name="regno" required>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>
        <br><br>

        <label>Phone:</label>
        <input type="tel" name="phone"
               placeholder="03XXXXXXXXX">
        <br><br>

        <label>Age:</label>
        <input type="number" name="age" min="16" max="40">
        <br><br>

        <label>Date of Birth:</label>
        <input type="date" name="dob">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        <label>Department:</label>
        <select name="department">
            <option value="AI">AI</option>
            <option value="CS">CS</option>
            <option value="SE">SE</option>
            <option value="EE">EE</option>
        </select>
        <br><br>

        <label>Interests:</label>
        <input type="checkbox" name="interest" value="Web"> Web
        <input type="checkbox" name="interest" value="AI"> AI
        <input type="checkbox" name="interest" value="Games"> Games
        <br><br>

        <label>Address:</label>
        <br>
        <textarea name="address" rows="4" cols="30"></textarea>
        <br><br>

        <button type="submit">Register</button>
        <button type="reset">Clear</button>

    </form>

</body>
